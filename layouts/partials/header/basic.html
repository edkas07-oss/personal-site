<div class="main-menu flex items-center w-full gap-2 p-1 pl-0 relative">
  <a href="{{ "" | relLangURL }}" class="text-base font-semibold truncate min-w-0 shrink hover:text-primary-500">
    Home
  </a>

  {{/* ── Center Teaser: Engineering Journal Coming Soon ── */}}
  <div class="ew-header-teaser-wrapper">
    <div class="ew-header-teaser">
      <span class="ew-header-teaser__title">Engineering Journal</span>
      <span class="ew-header-teaser__arrow">&rarr;</span>
      <span class="ew-header-teaser__badge">Coming Soon</span>
    </div>
  </div>

  <div class="flex items-center ms-auto">
    <div class="hidden md:flex">
      {{ partial "header/components/desktop-menu.html" . }}
    </div>
    <div class="flex md:hidden">
      {{ partial "header/components/mobile-menu.html" . }}
    </div>
  </div>
</div>

{{ if .Site.Params.highlightCurrentMenuArea }}
  <script>
    (function () {
      var mainmenu = document.querySelector(".main-menu");
      if (!mainmenu) return;

      var path = window.location.pathname;
      var links = mainmenu.querySelectorAll('a[href="' + path + '"]');

      links.forEach(function (link) {
        var targets = link.querySelectorAll("span");
        targets.forEach(function (el) {
          el.classList.add("active");
        });
      });
    })();
  </script>
{{ end }}
